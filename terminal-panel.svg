<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250" role="img" aria-labelledby="title desc">
<title id="title">DEMON895 terminal identity</title>
<desc id="desc">A terminal panel with separately colored status text, system labels, and neon outline.</desc>
<defs>
  <linearGradient id="border" x1="0" x2="1">
    <stop offset="0" stop-color="#39ff14"/>
    <stop offset=".52" stop-color="#39c5ff"/>
    <stop offset="1" stop-color="#ff4d6d"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="2.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="2" y="2" width="1096" height="246" rx="14" fill="#0b1016" stroke="#273440" stroke-width="2"/>
